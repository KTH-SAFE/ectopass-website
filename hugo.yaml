baseURL: https://ectopass.com/
locale: en-us
title: Ectopass
# Parse Git commit
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Benchmarks
      pageRef: /benchmarks
      weight: 2
    - name: Pricing
      pageRef: /pricing
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search

params:
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: static/logov2.png
      width: 90
      height: 90
    width: wide

  banner:
    key: announcement-001
    message: |
      ⚠️ Website under construction! We are finalizing different aspects of this project. Bear with us!
  # Display the last modification date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  # Display the author of the last modification
  displayUpdatedAuthor: false
  page:
    displayPagination: true # for docs pages
  blog:
    article:
      displayPagination: true # for blog articles
